{% extends "base.html" %}

{% block title %}Register — API Maintenance Agent{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus display-4 text-dark"></i>
          <h4 class="mt-2 fw-bold">Create Account</h4>
          <p class="text-muted small">API Maintenance Agent</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">
          <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Choose a username" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Choose a password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-dark w-100">
            <i class="bi bi-person-check me-1"></i>Register
          </button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Already have an account?
          <a href="/login" class="text-decoration-none">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
